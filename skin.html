            <!-- 2D Texture Preview -->
            <div class="bg-[#121214] p-3 rounded-xl border border-gray-800 flex flex-col items-center">
                <span class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider w-full text-left">UV Map Preview</span>

            <!-- Detail Breakdown -->

                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#8D99AE]"></div> Icy steel eyes & mauve shading</div>

<script>
/**
 * PART 1: TEXTURE GENERATION
 * Procedurally generates the exact 64x64 texture based on the detailed prompt.
 */

const PALETTE = {
    ' ': null,          // Transparent
    // Skin (Pale Ivory to Mauve shadow)
    's': '#E3D0C0', 'S': '#D2B5A5', 'h': '#F5E6DA', 'm': '#B0989B',
    // Hair (Black Side)
    '0': '#121214', '1': '#24252A', '2': '#0B0B0C',
    // Hair (Blonde Side)
    '3': '#FFFDF0', '4': '#EAE0C8', '5': '#DCD3BE',
    // Eyes & Face Features
    'e': '#2B2D42', // Charcoal top eye
    'E': '#8D99AE', // Steel bottom eye
    'W': '#FFFFFF', // Pure white specular
    'L': '#C5B9CD', // Lavender under-eye
    'r': '#800000', // Micro-heart tattoo
    'x': '#B0B5B9', // Silver piercings/hardware
    'X': '#7A8288', // Dark silver shadow
    // Torso Base (Thermal)
    't': '#1E1E24', // Slate
    'T': '#3A3B45', // Ash gray
    // Torso Overlay (Washed Hoodie)
    'H': '#202024', 'D': '#151518', 'O': '#2A2A2E',
    'g': '#E0E0E0', 'G': '#909090', // Back graphic
    // Legs (Slate Denim)
    'p': '#3B424C', 'P': '#2E343D', 'd': '#22272E',
    // Footwear / Ink
    'k': '#111111', 'K': '#1A1A1A', // Black details, ink, socks
    'w': '#F2F2F2',                 // Foxing tape
    'C': '#8899A6',                 // Carabiner
    'B': '#101010'                  // Belt
};

// Helpers for array generation
const rep = (str, n) => Array(n).fill(str);
const alt = (s1, s2, n) => Array.from({length: n}, (_, i) => i % 2 === 0 ? s1 : s2);
const blank = (w, h) => rep(rep(' ', w).join(''), h);

const SkinData = {
    headBase: { // u:0, v:0, w:8, h:8, d:8
        top: [
            "00003333", "01004333", "00203533", "01003333",
            "00003343", "02003533", "00003333", "00103333"
        ],
        bottom: rep("SSSSSSSS", 8),
        right: [ // Char's right (Black)
            "10010000", "00100200", "00ssshss", "0sssssss",
            "00sSssss", "00ssSsss", "00ssssss", "000sssss"
        ],
        front: [
            "10003343", // Messy fringe top
            "00103533", // Fringe low
            "0ssshsss", // Skin highlight
            "s0SssS0s", // Eyebrows (charcoal '0'). Slit left brow at x=6
            "seWssWeS", // Eyes Top + Inner Specular 'W'
            "sEsmmsEs", // Eyes Bottom + Mauve bags 'm'
            "ssrsssss", // Micro-heart 'r' at x=2
            "ssssssxs"  // Labret ring 'x' at x=6
        ],
        left: [ // Char's left (Blonde)
            "34335333", "33433353", "33ssssss", "3sssssss",
            "3ssSssss", "3sssSsss", "3sssssss", "33ssssss"
        ],
        back: alt("00003333", "01003433", 8)
    },
    headOverlay: { // u:32, v:0, w:8, h:8, d:8
        top: blank(8,8), bottom: blank(8,8), back: blank(8,8),
        front: [
            "        ", "        ", "10    43", "0      3",
            "        ", "        ", "        ", "        "
        ],
        right: ["        ", "        ", "        ", "        ", "        ", "        ", "    k   ", "        "], // Black plug (x=4)
        left:  ["        ", "        ", "        ", "        ", "        ", "        ", "   x    ", "   x    "]  // Silver cross (x=3)
    },
    torsoBase: { // u:16, v:16, w:8, h:12, d:4
        top: rep("TTTTTTTT", 4), bottom: rep("tttttttt", 4),
        right: alt("TTTT", "tttt", 12),
        front: alt("TTTTTTTT", "tttttttt", 12),
        left: alt("TTTT", "tttt", 12),
        back: alt("TTTTTTTT", "tttttttt", 12)
    },
    torsoOverlay: { // u:16, v:32, w:8, h:12, d:4
        top: rep("HHHHHHHH", 4), bottom: rep("HH    HH", 4),
        right: rep("HHHH", 12), left: rep("HHHH", 12),
        front: [
            "HO  OHHH", // Unzipped front
            "H x  x H", // Collar chain
            "H      H", 
            "H XX X H", // Lower chain
            "H X    H", // Padlock
            "HO    OH",
            "H      H", "H      H", "HO    OH", "H      H", "H      H", "HO    OH"
        ],
        back: [
            "HHHHHHHH", "HHgHggHH", "HHgGggHH", "HHHHHHHH",
            "HgggGggH", "HHGgGgHH", "HgggGggH", "HHHHHHHH",
            "HHgGggHH", "HHGgGgHH", "HHHHHHHH", "HHHHHHHH"
        ]
    },
    rightArmBase: { // u:40, v:16, w:4, h:12, d:4
        top: rep("TTTT", 4), bottom: rep("ssss", 4),
        right: [...alt("TTTT", "tttt", 6), "ssss", "sSss", "kskk", "kkxk", "ssss", "ssss"], // Tattoo
        front: [...alt("TTTT", "tttt", 6), "ssss", "sSss", "kskk", "kkxk", "ssss", "ssss"],
        left:  [...alt("TTTT", "tttt", 6), "ssss", "sSss", "kskk", "kkxk", "ssss", "ssss"],
        back:  [...alt("TTTT", "tttt", 6), "ssss", "sSss", "kskk", "kkxk", "ssss", "ssss"]
    },
    rightArmOverlay: { // u:40, v:32, w:4, h:12, d:4 (Pushed up sleeve)
        top: rep("HHHH", 4), bottom: blank(4,4),
        right: ["HHHH", "HHOH", "HHDH", "HHHH", "HDDH", "HOOH", ...blank(4,6)],
        front: ["HHHH", "HHOH", "HHDH", "HHHH", "HDDH", "HOOH", ...blank(4,6)],

    },
    leftArmOverlay: { // u:48, v:48, w:4, h:12, d:4 (Oversized thumb-hole sleeve)
        top: rep("HHHH", 4), bottom: blank(4,4),
        right: [...rep("HHHH", 5), "HHDH", "HHOH", "HHHH", "DDHH", "HHDH", "HHHH", "    "],
        front: [...rep("HHHH", 5), "HHDH", "HHOH", "HHHH", "DDHH", "HHDH", "H  H", "    "], // Thumbhole
        left:  [...rep("HHHH", 5), "HHDH", "HHOH", "HHHH", "DDHH", "HHDH", "HHHH", "    "],
        back:  [...rep("HHHH", 5), "HHDH", "HHOH", "HHHH", "DDHH", "HHDH", "HHHH", "    "]
    },
    rightLegBase: { // u:0, v:16, w:4, h:12, d:4
        top: rep("pppp", 4), bottom: rep("KkkK", 4),
        right: ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "ssss", "ssSs", "PppP", "KKKK", "KKwK", "KkkK"], // Tears & Socks
        front: ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "ssss", "ssSs", "PppP", "KKKK", "KKwK", "KkkK"],
        left:  ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "ssss", "ssSs", "PppP", "KKKK", "KKwK", "KkkK"],
        back:  ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "PppP", "pddp", "PppP", "KKKK", "KKwK", "KkkK"] // No tear on back
    },
    rightLegOverlay: { // u:0, v:32, w:4, h:12, d:4
        top: blank(4,4), bottom: rep("wwww", 4),
        right: ["    ", "  C ", "    ", "ppPp", "pPpp", "ppPp", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"], // Carabiner 'C' + Cargo + Shoes
        front: ["BBCB", "    ", "    ", "ppPp", "pPpp", "ppPp", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"],
        left:  ["    ", "    ", "    ", "    ", "    ", "    ", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"],
        back:  ["BBBB", "    ", "    ", "    ", "    ", "    ", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"]
    },
    leftLegBase: { // u:16, v:48, w:4, h:12, d:4
        top: rep("pppp", 4), bottom: rep("KkkK", 4),
        right: ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "ssss", "ssSs", "PppP", "KKKK", "KKwK", "KkkK"],
        front: ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "ssss", "ssSs", "PppP", "KKKK", "KKwK", "KkkK"],
        left:  ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "ssss", "ssSs", "PppP", "KKKK", "KKwK", "KkkK"],
        back:  ["pppp", "pddp", "PppP", "pppp", "pddp", "PppP", "PppP", "pddp", "PppP", "KKKK", "KKwK", "KkkK"]
    },
    leftLegOverlay: { // u:0, v:48, w:4, h:12, d:4
        top: blank(4,4), bottom: rep("wwww", 4),
        right: ["    ", "    ", "    ", "    ", "    ", "    ", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"],
        front: ["xBBB", "x   ", "X   ", "x   ", "    ", "    ", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"], // Wallet chain start
        left:  ["    ", " xXX", "X   ", " xXX", "pPpp", "ppPp", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"], // Chain loop + Cargo
        back:  ["BBBB", "    ", "    ", "    ", "    ", "    ", ...blank(4,2), "KKKK", "WkWW", "KkkK", "wwww"]
    }
};

// Canvas Setup
const skinCanvas = document.createElement('canvas');
skinCanvas.width = 64;
skinCanvas.height = 64;
const ctx = skinCanvas.getContext('2d', { willReadFrequently: true });

function drawFace(u, v, w, h, data) {
    if (!data) return;
    for (let r = 0; r < h; r++) {
        let row = data[r];
        if (!row) continue;
        for (let c = 0; c < w; c++) {
            let char = row[c];
            if (char && PALETTE[char]) {
                ctx.fillStyle = PALETTE[char];
                ctx.fillRect(u + c, v + r, 1, 1);
            }
        }
    }
}

function renderSkinData() {
    ctx.clearRect(0, 0, 64, 64);
    
    const parts = [
        { key: 'headBase', u: 0, v: 0, w: 8, h: 8, d: 8 },
        { key: 'headOverlay', u: 32, v: 0, w: 8, h: 8, d: 8 },
        { key: 'torsoBase', u: 16, v: 16, w: 8, h: 12, d: 4 },
        { key: 'torsoOverlay', u: 16, v: 32, w: 8, h: 12, d: 4 },
        { key: 'rightArmBase', u: 40, v: 16, w: 4, h: 12, d: 4 },
        { key: 'rightArmOverlay', u: 40, v: 32, w: 4, h: 12, d: 4 },
        { key: 'leftArmBase', u: 32, v: 48, w: 4, h: 12, d: 4 },
        { key: 'leftArmOverlay', u: 48, v: 48, w: 4, h: 12, d: 4 },
        { key: 'rightLegBase', u: 0, v: 16, w: 4, h: 12, d: 4 },
        { key: 'rightLegOverlay', u: 0, v: 32, w: 4, h: 12, d: 4 },
        { key: 'leftLegBase', u: 16, v: 48, w: 4, h: 12, d: 4 },
        { key: 'leftLegOverlay', u: 0, v: 48, w: 4, h: 12, d: 4 }
    ];

    parts.forEach(p => {
        const data = SkinData[p.key];
        drawFace(p.u + p.d, p.v, p.w, p.d, data.top);
        drawFace(p.u + p.d + p.w, p.v, p.w, p.d, data.bottom);
        drawFace(p.u, p.v + p.d, p.d, p.h, data.right);
        drawFace(p.u + p.d, p.v + p.d, p.w, p.h, data.front);
        drawFace(p.u + p.d + p.w, p.v + p.d, p.d, p.h, data.left);
        drawFace(p.u + p.d + p.w + p.d, p.v + p.d, p.w, p.h, data.back);
    });

    // Update 2D Preview UI
    const previewCtx = document.getElementById('preview2d').getContext('2d');
    previewCtx.clearRect(0,0,256,256);
    previewCtx.drawImage(skinCanvas, 0, 0, 256, 256);
}

renderSkinData();

// Download Handler
document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'modern_eboy_skin_64x64.png';
    link.href = skinCanvas.toDataURL('image/png');
    link.click();
});

/**
 * PART 2: THREE.JS 3D RENDERER
 * Maps the generated 2D canvas exactly to a 3D dual-layer Steve model.
 */

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1A1A1D');
// Subtle grid for professional studio feel
const grid = new THREE.GridHelper(100, 100, 0x333333, 0x222222);
grid.position.y = -12;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 10, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 30, 20);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaaccff, 0.3);
fillLight.position.set(-20, 10, -20);
scene.add(fillLight);

// Texture Setup
const skinTexture = new THREE.CanvasTexture(skinCanvas);
skinTexture.magFilter = THREE.NearestFilter;
skinTexture.minFilter = THREE.NearestFilter;
skinTexture.colorSpace = THREE.SRGBColorSpace;

const materialBase = new THREE.MeshLambertMaterial({ 
    map: skinTexture, 
    transparent: true, 
    alphaTest: 0.5,
    side: THREE.DoubleSide
});
const materialOverlay = materialBase.clone();
// Overlay gets slight depth bias to prevent Z-fighting, though scaling mostly fixes it.

// Model Construction
const playerGroup = new THREE.Group();
playerGroup.position.y = -12; // Center model in view
scene.add(playerGroup);

// Helper to precisely set UVs on PlaneGeometry to match standard MC mapping without rotation hacks
function updatePlaneUVs(geometry, u, v, tw, th) {
    const uvs = geometry.attributes.uv;
    const u0 = u / 64, v0 = 1 - v / 64;
    const u1 = (u + tw) / 64, v1 = 1 - (v + th) / 64;
    // Indices: 0: top-left, 1: top-right, 2: bottom-left, 3: bottom-right
    uvs.setXY(0, u0, v0);
    uvs.setXY(1, u1, v0);
    uvs.setXY(2, u0, v1);
    uvs.setXY(3, u1, v1);
    uvs.needsUpdate = true;
}

// Builds a Minecraft body part out of 6 planes for absolute UV control
function buildMCBox(u, v, w, h, d, isOverlay = false) {
    const group = new THREE.Group();
    const scale = isOverlay ? 1.07 : 1.0; // Slightly larger for outer layer
    const mat = isOverlay ? materialOverlay : materialBase;

    const planes = [
        // Front (+z)
        { geom: new THREE.PlaneGeometry(w, h), pos: [0, 0, d/2], rot: [0, 0, 0], uv: [u+d, v+d, w, h] },
        // Back (-z)
        { geom: new THREE.PlaneGeometry(w, h), pos: [0, 0, -d/2], rot: [0, Math.PI, 0], uv: [u+d+w+d, v+d, w, h] },
        // Right (-x) - Character's right, Viewer's left
        { geom: new THREE.PlaneGeometry(d, h), pos: [-w/2, 0, 0], rot: [0, -Math.PI/2, 0], uv: [u, v+d, d, h] },
        // Left (+x) - Character's left, Viewer's right
        { geom: new THREE.PlaneGeometry(d, h), pos: [w/2, 0, 0], rot: [0, Math.PI/2, 0], uv: [u+d+w, v+d, d, h] },
        // Top (+y)
        { geom: new THREE.PlaneGeometry(w, d), pos: [0, h/2, 0], rot: [-Math.PI/2, 0, 0], uv: [u+d, v, w, d] },
        // Bottom (-y)
        { geom: new THREE.PlaneGeometry(w, d), pos: [0, -h/2, 0], rot: [Math.PI/2, 0, 0], uv: [u+d+w, v, w, d] }
    ];

    planes.forEach(p => {
        updatePlaneUVs(p.geom, p.uv[0], p.uv[1], p.uv[2], p.uv[3]);
        const mesh = new THREE.Mesh(p.geom, mat);
        mesh.position.set(...p.pos);
        mesh.rotation.set(...p.rot);
        group.add(mesh);
    });

    group.scale.set(scale, scale, scale);
    return group;
}

// Assemble Body Parts
const head = new THREE.Group(); head.position.set(0, 24, 0);
const headBaseMesh = buildMCBox(0, 0, 8, 8, 8); headBaseMesh.position.y = 4;
const headOverlayMesh = buildMCBox(32, 0, 8, 8, 8, true); headOverlayMesh.position.y = 4;
head.add(headBaseMesh, headOverlayMesh);
playerGroup.add(head);

const torso = new THREE.Group(); torso.position.set(0, 18, 0); // Center of 12-high torso
const torsoBaseMesh = buildMCBox(16, 16, 8, 12, 4);
const torsoOverlayMesh = buildMCBox(16, 32, 8, 12, 4, true);
torso.add(torsoBaseMesh, torsoOverlayMesh);
playerGroup.add(torso);

const rightArm = new THREE.Group(); rightArm.position.set(-6, 22, 0);
const rightArmBaseMesh = buildMCBox(40, 16, 4, 12, 4); rightArmBaseMesh.position.y = -4;
const rightArmOverlayMesh = buildMCBox(40, 32, 4, 12, 4, true); rightArmOverlayMesh.position.y = -4;
rightArm.add(rightArmBaseMesh, rightArmOverlayMesh);
playerGroup.add(rightArm);

const leftArm = new THREE.Group(); leftArm.position.set(6, 22, 0);
const leftArmBaseMesh = buildMCBox(32, 48, 4, 12, 4); leftArmBaseMesh.position.y = -4;
const leftArmOverlayMesh = buildMCBox(48, 48, 4, 12, 4, true); leftArmOverlayMesh.position.y = -4;
leftArm.add(leftArmBaseMesh, leftArmOverlayMesh);
playerGroup.add(leftArm);

const rightLeg = new THREE.Group(); rightLeg.position.set(-2, 12, 0);
const rightLegBaseMesh = buildMCBox(0, 16, 4, 12, 4); rightLegBaseMesh.position.y = -6;
const rightLegOverlayMesh = buildMCBox(0, 32, 4, 12, 4, true); rightLegOverlayMesh.position.y = -6;
rightLeg.add(rightLegBaseMesh, rightLegOverlayMesh);
playerGroup.add(rightLeg);

const leftLeg = new THREE.Group(); leftLeg.position.set(2, 12, 0);
const leftLegBaseMesh = buildMCBox(16, 48, 4, 12, 4); leftLegBaseMesh.position.y = -6;
const leftLegOverlayMesh = buildMCBox(0, 48, 4, 12, 4, true); leftLegOverlayMesh.position.y = -6;
leftLeg.add(leftLegBaseMesh, leftLegOverlayMesh);
playerGroup.add(leftLeg);

// Interaction & Animation
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let autoRotate = true;
let time = 0;

const startDrag = (x, y) => { isDragging = true; autoRotate = false; previousMousePosition = { x, y }; };
const moveDrag = (x, y) => {
    if (isDragging) {
        const deltaX = x - previousMousePosition.x;
        const deltaY = y - previousMousePosition.y;
        playerGroup.rotation.y += deltaX * 0.01;
        playerGroup.rotation.x += deltaY * 0.01;
        // Clamp vertical rotation
        playerGroup.rotation.x = Math.max(-0.5, Math.min(0.5, playerGroup.rotation.x));
        previousMousePosition = { x, y };
    }
};
const endDrag = () => { isDragging = false; };

// Mouse Events
container.addEventListener('mousedown', (e) => startDrag(e.offsetX, e.offsetY));
window.addEventListener('mousemove', (e) => moveDrag(e.offsetX, e.offsetY));
window.addEventListener('mouseup', endDrag);
// Touch Events
container.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
window.addEventListener('touchend', endDrag);

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

// Render Loop
function animate() {
    requestAnimationFrame(animate);
    
    time += 0.02;
    
    if (autoRotate) {
        playerGroup.rotation.y -= 0.01;
    }

    // Subtle idle breathing animation
    torso.position.y = 18 + Math.sin(time) * 0.2;
    head.position.y = 24 + Math.sin(time) * 0.2;
    rightArm.position.y = 22 + Math.sin(time) * 0.2;
    leftArm.position.y = 22 + Math.sin(time) * 0.2;
    
    // Subtle arm swing
    rightArm.rotation.x = Math.sin(time * 0.5) * 0.1;
    leftArm.rotation.x = -Math.sin(time * 0.5) * 0.1;

    renderer.render(scene, camera);
}

// Initial positioning to show off front-left three-quarter angle
playerGroup.rotation.y = -Math.PI / 4;

animate();
</script>
</body>
</html>
