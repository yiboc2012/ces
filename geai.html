<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Randomly Great Idea Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: background 0.8s ease;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 550px;
            width: 100%;
            backdrop-filter: blur(10px);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
        }

        .tag {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            transition: background 0.5s ease;
        }

        h1 {
            color: #2d3748;
            font-size: 2rem;
            line-height: 1.4;
            margin-bottom: 30px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            background: #2d3748;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #1a202c;
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Floating background decoration elements */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            z-index: -1;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>

    <!-- Background Shapes -->
    <div class="shape" style="width: 200px; height: 200px; top: 10%; left: 10%;"></div>
    <div class="shape" style="width: 300px; height: 300px; bottom: 10%; right: 10%; animation-delay: -2s;"></div>

    <div class="card">
        <span class="tag" id="industry-tag">Tech Startup</span>
        <h1 id="idea-text">An AI that text-messages you friendly reminders to drink water like an overly aggressive gym bro.</h1>
        <button class="btn" id="generate-btn">Gimme Another One</button>
    </div>

    <script>
        const audiences = [
            "for stressed college students", "specifically for introverts", "for overly competitive grandmas", 
            "for tired parents", "for chaotic cats", "for multi-millionaires who are bored", 
            "for people who hit snooze 5 times", "for plant lovers who forget to water them"
        ];

        const coreConcepts = [
            "An AI companion that", "A subscription box service that delivers", "A hyper-targeted social network for", 
            "An Uber-style app designed to source", "A smart wearable device that tracks your", "A quiet sanctuary website that hosts",
            "A gamified task manager that punishes you for"
        ];

        const twists = [
            "messages you aggressive motivational texts like a gym bro", "sends you actual dirt from exotic locations",
            "matches you with people who share your exact hyper-fixations", "delivers hot, freshly baked cookies at 3 AM",
            "screams gently when your screen time exceeds 4 hours", "swaps your favorite playlists with sea shanties if you procrastinate",
            "helps you politely end awkward phone calls with fake emergency noises"
        ];

        const industries = ["Tech Startup", "App Idea", "Side Hustle", "Chaotic Good", "Pure Whimsy", "Niche Retail"];

        const colorPalettes = [
            ["#667eea", "#764ba2"],
            ["#ff9a9e", "#fecfef"],
            ["#f12711", "#f5af19"],
            ["#11998e", "#38ef7d"],
            ["#ff007f", "#7f00ff"],
            ["#0575e6", "#00f260"],
            ["#434343", "#000000"]
        ];

        const ideaText = document.getElementById('idea-text');
        const industryTag = document.getElementById('industry-tag');
        const generateBtn = document.getElementById('generate-btn');
        const bodyBg = document.body;

        function generateRandomIdea() {
            // Pick random pieces
            const randAudience = audiences[Math.floor(Math.random() * audiences.length)];
            const randConcept = coreConcepts[Math.floor(Math.random() * coreConcepts.length)];
            const randTwist = twists[Math.floor(Math.random() * twists.length)];
            const randIndustry = industries[Math.floor(Math.random() * industries.length)];
            const randPalette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];

            // Construct sentence structure seamlessly
            const finalIdea = `${randConcept} ${randTwist} ${randAudience}.`;

            // Apply to DOM with smooth updates
            ideaText.textContent = finalIdea;
            industryTag.textContent = randIndustry;
            
            // Apply new dynamic gradient background and match the button tag
            bodyBg.style.background = `linear-gradient(135deg, ${randPalette[0]} 0%, ${randPalette[1]} 100%)`;
            industryTag.style.background = randPalette[0];
        }

        generateBtn.addEventListener('click', generateRandomIdea);
    </script>
</body>
</html>
